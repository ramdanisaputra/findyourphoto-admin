<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Fotografer - AI Photo Finder</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-center items-center p-4">

  <!-- Card Utama -->
  <div class="bg-slate-800 p-6 rounded-xl shadow-xl w-full max-w-md border border-slate-700">
    <h1 class="text-2xl font-bold text-center text-blue-400 mb-6">Admin Photo Finder</h1>

    <!-- Tampilan Sebelum Login -->
    <div id="loginSection" class="text-center py-4">
      <p class="text-slate-400 mb-4">Silakan login menggunakan akun Gmail fotografer untuk membuat event baru.</p>
      <button id="btnLogin" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 px-4 rounded-lg flex items-center justify-center gap-2 transition">
        <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
        Login dengan Google
      </button>
    </div>

    <!-- Tampilan Setelah Login -->
    <div id="adminSection" class="hidden">
      <div class="flex justify-between items-center mb-6 pb-3 border-b border-slate-700">
        <div>
          <p class="text-xs text-slate-400">Selamat datang,</p>
          <p id="userName" class="font-semibold text-blue-300"></p>
        </div>
        <button id="btnLogout" class="text-xs bg-red-600/20 hover:bg-red-600/40 text-red-400 py-1 px-3 rounded border border-red-500/30">Logout</button>
      </div>

      <!-- Form Event Baru -->
      <form id="eventForm" class="space-y-4">
        <div>
          <label class="block text-sm text-slate-300 mb-1">Nama Event / Sesi</label>
          <input type="text" id="eventName" required placeholder="Contoh: Sunmori Lembang" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500">
        </div>

        <div>
          <label class="block text-sm text-slate-300 mb-1">Tanggal Event</label>
          <input type="date" id="eventDate" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500">
        </div>

        <div>
          <label class="block text-sm text-slate-300 mb-1">Link Google Drive Utuh</label>
          <input type="url" id="gdriveUrl" required placeholder="https://drive.google.com/drive/folders/..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-blue-500">
          <p class="text-xs text-slate-500 mt-1">Folder ID akan diekstrak secara otomatis.</p>
        </div>

        <button type="submit" id="btnSubmit" class="w-full bg-blue-600 hover:bg-blue-500 font-semibold py-2.5 rounded-lg transition mt-4">
          Kirim ke Antrean AI
        </button>
      </form>

      <div id="statusMessage" class="mt-4 text-center text-sm font-medium hidden"></div>
    </div>
  </div>

  <!-- Firebase Script (SDK v10 Modular) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Konfigurasi dari proyek kamu
    const firebaseConfig = {
      apiKey: "AizaSyCO2QRZMA1Ui8J1eQA89o76oSc_YpfdEiU",
      authDomain: "find-your-photo-188a0.firebaseapp.com",
      projectId: "find-your-photo-188a0",
      storageBucket: "find-your-photo-188a0.firebasestorage.app",
      messagingSenderId: "212497999030",
      appId: "1:212497999030:web:82380565489f6140ebf217",
      measurementId: "G-G7SLK6MJ8E"
    };

    // Inisialisasi Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // Elemen DOM
    const loginSection = document.getElementById("loginSection");
    const adminSection = document.getElementById("adminSection");
    const userName = document.getElementById("userName");
    const btnLogin = document.getElementById("btnLogin");
    const btnLogout = document.getElementById("btnLogout");
    const eventForm = document.getElementById("eventForm");
    const statusMessage = document.getElementById("statusMessage");

    // Fungsi Ekstraksi Folder ID GDrive
    function extractFolderId(url) {
      const match = url.match(/folders\/([a-zA-Z0-9_-]+)/);
      return match ? match[1] : null;
    }

    // Pantau Status Login
    onAuthStateChanged(auth, (user) => {
      if (user) {
        userName.textContent = user.displayName || user.email;
        loginSection.classList.add("hidden");
        adminSection.classList.remove("hidden");
      } else {
        loginSection.classList.remove("hidden");
        adminSection.classList.add("hidden");
      }
    });

    // Event Login
    btnLogin.addEventListener("click", async () => {
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        alert("Gagal login: " + err.message);
      }
    });

    // Event Logout
    btnLogout.addEventListener("click", () => signOut(auth));

    // Submit Event Baru
    eventForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const name = document.getElementById("eventName").value;
      const date = document.getElementById("eventDate").value;
      const rawUrl = document.getElementById("gdriveUrl").value;
      
      const folderId = extractFolderId(rawUrl);
      if (!folderId) {
        alert("Link Google Drive tidak valid! Pastikan ada /folders/ID_FOLDER");
        return;
      }

      statusMessage.className = "mt-4 text-center text-sm font-medium text-blue-400";
      statusMessage.textContent = "Mengirim data ke antrean...";
      statusMessage.classList.remove("hidden");

      try {
        // Simpan ke Firestore koleksi 'queues' dengan status 'Pending'[cite: 1]
        await addDoc(collection(db, "queues"), {
          photographer_name: auth.currentUser.displayName || auth.currentUser.email,
          photographer_email: auth.currentUser.email,
          event_name: name,
          event_date: date,
          gdrive_folder_id: folderId,
          status: "Pending", // Status awal Pending[cite: 1]
          created_at: serverTimestamp()
        });

        statusMessage.className = "mt-4 text-center text-sm font-medium text-green-400";
        statusMessage.textContent = "Event berhasil dikirim ke antrean AI!";
        eventForm.reset();
      } catch (err) {
        statusMessage.className = "mt-4 text-center text-sm font-medium text-red-400";
        statusMessage.textContent = "Gagal menyimpan: " + err.message;
      }
    });
  </script>
</body>
</html>
